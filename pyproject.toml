[project]
name = "nata-agent"
version = "0.1.2"
description = "Nata — autonomous back-office & compliance engine for Indonesian SMBs: receipt → SAK EMKM journal → PPh Final tax → KBLI 2020 licensing, each grounded in its statutory source"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=2.12,<3",
    "google-genai>=2.30,<3",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
