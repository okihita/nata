[project]
name = "nata-agent"
version = "0.1.0"
description = "Nata — autonomous back-office & compliance engine for Indonesian SMBs (Slice A: receipt photo -> SAK EMKM journal entry)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=2.12,<3",
    "google-genai>=2.30,<3",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
